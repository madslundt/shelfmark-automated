version: "3.8"

services:
  shelfmark-automated:
    build:
      context: .
    image: madslundt/shelfmark-automated:latest
    container_name: shelfmark-automated
    restart: unless-stopped
    environment:
      # --- Required ---
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY}
      - GOODREADS_RSS_URL=${GOODREADS_RSS_URL}

      # --- CWA (Calibre-Web Automated) ---
      # Use service name if on the same Docker network, or a full URL otherwise.
      # Example: http://homeassistant.local:8083
      - CWA_URL=${CWA_URL:-http://cwa:8083}
      - CWA_USERNAME=${CWA_USERNAME:-}
      - CWA_PASSWORD=${CWA_PASSWORD:-}

      # --- Shelfmark ---
      # Use service name if on the same Docker network, or a full URL otherwise.
      # Example: http://homeassistant.local:8084
      - SHELFMARK_URL=${SHELFMARK_URL:-http://shelfmark:8084}
      # Leave blank if Shelfmark is configured with AUTH_METHOD=none
      - SHELFMARK_USERNAME=${SHELFMARK_USERNAME:-}
      - SHELFMARK_PASSWORD=${SHELFMARK_PASSWORD:-}

      # --- Optional ---
      - HARDCOVER_USER_ID=${HARDCOVER_USER_ID:-}
      # Sync interval: random between MIN and MAX seconds to reduce API ban risk.
      # Defaults: 2–15 minutes. Set both to the same value for a fixed interval.
      - SYNC_INTERVAL_MIN_SECONDS=${SYNC_INTERVAL_MIN_SECONDS:-120}
      - SYNC_INTERVAL_MAX_SECONDS=${SYNC_INTERVAL_MAX_SECONDS:-900}
      # Legacy fixed interval (still supported; sets min=max=N). Use 0 to run once and exit.
      - SYNC_INTERVAL_SECONDS=${SYNC_INTERVAL_SECONDS:-}
      # Incremental sync: only process newly added books each run.
      # Requires a volume mounted at /data to persist state across container restarts (see below).
      - STATE_FILE=${STATE_FILE:-}
      # Full verification interval in seconds (default: 86400 = 24h). Set to 0 to disable.
      - FULL_SYNC_INTERVAL_SECONDS=${FULL_SYNC_INTERVAL_SECONDS:-86400}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # File-permission control for the /data volume.
      # Use PUID=0 / PGID=0 if your bind mount is root-owned (common on NAS / Portainer).
      # Default: 1000 (appuser). Override in your .env file.
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}

    # Uncomment and adjust if CWA / Shelfmark are on an external Docker network:
    # networks:
    #   - media_network

    # Uncomment to persist incremental sync state across container restarts:
    # volumes:
    #   - shelfmark_state:/data

# networks:
#   media_network:
#     external: true

# volumes:
#   shelfmark_state:
