[project]
name = "shelfmark-automated"
version = "1.0.11"
requires-python = ">=3.14"
dependencies = [
    "requests==2.31.0",
    "feedparser==6.0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
